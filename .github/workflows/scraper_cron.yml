name: KoUp Multi-Site Scraper & Pending Source Auto-Resolver Cron

on:
  schedule:
    # Her 12 saatte bir (günde 2 kez) yeni bölümleri tara ve eksik kaynakları çöz
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      target_site:
        description: 'Taranacak hedef servis / bot'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - series_automation
          - pending_resolver
          - animecix
          - hdfilm
          - ddizi
          - dizikorea
          - dizibox
          - dizilla
          - dizifon
          - asyawatch
          - asyamag
          - calendar
          - watchdog_24h
      pending_limit:
        description: 'Doğrudan kontrol edilecek bekleyen bölüm sayısı'
        required: false
        default: '150'
        type: string
      batch_dramas:
        description: 'Çapraz aranacak dizi sayısı (DiziKorea, DiziFon, AsyaWatch)'
        required: false
        default: '30'
        type: string

jobs:
  scrape-and-resolve-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout KoUp Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Scraper & Resolver Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi boto3 cryptography

      - name: Run KoUp Multi-Site Scraper & Cross-Site Source Resolver
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CF_R2_ENDPOINT: ${{ secrets.CF_R2_ENDPOINT }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
          TARGET_SITE: ${{ github.event.inputs.target_site }}
          PENDING_LIMIT: ${{ github.event.inputs.pending_limit }}
          BATCH_DRAMAS: ${{ github.event.inputs.batch_dramas }}
        run: |
          TARGET="${TARGET_SITE:-all}"
          PLIMIT="${PENDING_LIMIT:-150}"
          BDRAMAS="${BATCH_DRAMAS:-30}"
          TRIGGER="${{ github.event_name }}"
          python scripts/cron_sync_pipeline.py \
            --target "$TARGET" \
            --pending-limit "$PLIMIT" \
            --batch-dramas "$BDRAMAS" \
            --trigger "${TRIGGER:-cron}"
