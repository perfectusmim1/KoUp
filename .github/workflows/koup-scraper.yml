name: KoUp Auto-Scraper & 24h Watchdog Cron

on:
  schedule:
    # Her 4 saatte bir yeni bölümleri ve AsyaMag haberlerini kontrol et
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      target_site:
        description: 'Taranacak hedef site (all, asyamag, dizikorea, tranimeizle, diziyou, dizibox, watchdog_24h)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - asyamag
          - dizikorea
          - tranimeizle
          - diziyou
          - dizibox
          - watchdog_24h

jobs:
  sync-catalog-and-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout KoUp Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi

      - name: Run KoUp Incremental Scraper & 24h Watchdog
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://aocvcotmikzlwbaezdpl.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python scripts/cron_sync_pipeline.py --target "${{ github.event.inputs.target_site || 'all' }}"
